name: Documentation issue
description: Report unclear, incorrect, missing, or broken documentation.
title: "[Docs]: "
body:
  - type: input
    id: location
    attributes:
      label: Page or location
      description: Link to the page or name the file and section.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is unclear, incorrect, missing, or broken.
    validations:
      required: true

  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
      description: Optional wording, example, or expected destination.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission check
      options:
        - label: This report does not contain credentials, private data, or a security vulnerability.
          required: true
