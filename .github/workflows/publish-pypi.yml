name: Publish Toetra to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact stable version to publish (for example 1.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'KintanaOne/Toetra' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    if: github.repository == 'KintanaOne/Toetra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/toetra/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Download the archives tested by this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toetra-distributions
          path: dist
          digest-mismatch: error

      - name: Check version and archive checksums
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/release/check_pypi_artifacts.py dist --output publish-dist

      - name: Publish verified archives using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: publish-dist/
          skip-existing: "false"
          attestations: "true"
          print-hash: "true"
