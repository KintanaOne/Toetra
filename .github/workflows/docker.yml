name: Docker

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and test Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker buildx build --load -t toetra:ci .

      - name: Check CLI
        run: |
          docker run --rm toetra:ci --help
          docker run --rm toetra:ci --version
                
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE_REF: ghcr.io/kintanaone/toetra
        run: |
          docker tag toetra:ci "$IMAGE_REF:edge"
          docker tag toetra:ci "$IMAGE_REF:sha-$GITHUB_SHA"
          docker push "$IMAGE_REF:edge"
          docker push "$IMAGE_REF:sha-$GITHUB_SHA"