name: Toetra CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install project with development and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,docs]"

      - name: Run non-mutating Toetra CI
        run: make ci

      - name: Verify CI left the checkout unchanged
        run: |
          git status --short
          test -z "$(git status --porcelain)"

  release:
    name: Distribution and clean-install contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install project with development and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,docs]"

      - name: Build reproducible distributions
        run: make release-check

      - name: Run public demonstrations
        run: make demo-check

      - name: Verify reproducible review bundle
        run: make review-bundle-check

      - name: Verify release checks left the checkout unchanged
        run: |
          git status --short
          test -z "$(git status --porcelain)"
