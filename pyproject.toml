[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forml"
version = "0.1.0"
description = "DSL FORML – un langage de spécification de propriétés qualitatives pour modèles ML"
authors = [{ name="KintanaOne.", email="KintanaOne@proton.me" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lark-parser>=0.12",
    "pytest>=7.0"
]

[tool.setuptools.packages.find]
where = ["forml"]
