[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forml"
version = "0.1.0"
description = "DSL FORML – un langage de spécification de propriétés qualitatives pour modèles ML"
authors = [{ name="KintanaOne.", email="KintanaOne@proton.me" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hypothesis==6.151.10",
    "iniconfig==2.3.0",
    "lark==1.2.2",
    "packaging==25.0",
    "pluggy==1.6.0",
    "Pygments==2.19.2",
    "pytest==9.0.1",
    "sortedcontainers==2.4.0"
]

[tool.setuptools.packages.find]
where = ["forml"]
