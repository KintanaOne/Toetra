[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forml"
version = "0.1.0"
description = "DSL FORML – un langage de spécification de propriétés qualitatives pour modèles ML"
authors = [{ name = "KintanaOne", email = "KintanaOne@proton.me" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lark==1.2.2",
    "Pygments==2.19.2",
    "joblib==1.5.3",
    "scikit-learn==1.8.0",
    "pandas==3.0.2",
    "z3-solver==4.16.0.0"
]

[project.optional-dependencies]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dsl*", "model*"]
exclude = ["test*", "tests*", "docs*"]

[tool.setuptools.package-data]
"dsl.language.grammar" = ["*.lark", "*.ebnf"]

[tool.black]
line-length = 88
target-version = ["py311"]
force-exclude = '''
test/hypothesis/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    "test/hypothesis",
]

[tool.ruff.lint.per-file-ignores]
"test/unit/model/test_xgboost_introspector_optional.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
norecursedirs = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    ".hypothesis",
    "test/hypothesis",
]

[tool.pyright]
pythonVersion = "3.11"
include = [
    "dsl",
    "model",
    "test/unit",
]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    ".env",
    "**/*.env",
    ".venv",
    "**/*.venv",
    "build",
    "dist",
    "test/hypothesis",
]