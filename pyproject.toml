[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forml"
version = "0.1.0"
description = "DSL FORML – un langage de spécification de propriétés qualitatives pour modèles ML"
authors = [{ name="KintanaOne.", email="KintanaOne@proton.me" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lark==1.2.2",
    "Pygments==2.19.2",
    "joblib==1.5.3",
    "scikit-learn==1.8.0",
    "pandas==3.0.2",
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.6"
]


[tool.setuptools.packages.find]
where = ["forml"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]