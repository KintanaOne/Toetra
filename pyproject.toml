[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toetra"
version = "1.0.0rc3"
description = "Declarative behavioral specification and formal verification for machine-learning models"
authors = [{ name = "KintanaOne", email = "KintanaOne@proton.me" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["machine-learning", "formal-verification", "smt", "z3", "model-validation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "lark==1.2.2",
    "Pygments==2.19.2",
    "joblib==1.5.3",
    "scikit-learn==1.8.0",
    "pandas==3.0.2",
    "z3-solver==4.16.0.0"
]

[project.urls]
Homepage = "https://github.com/KintanaOne/Toetra"
Documentation = "https://kintanaone.github.io/Toetra/"
Repository = "https://github.com/KintanaOne/Toetra"
Issues = "https://github.com/KintanaOne/Toetra/issues"
Changelog = "https://github.com/KintanaOne/Toetra/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest==9.0.1",
    "hypothesis==6.151.10",
    "ruff==0.15.22",
    "black==26.5.1",
    "pyright==1.1.411",
    "build==1.5.0",
    "packaging==25.0",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["toetra*", "dsl*", "model*"]
exclude = ["test*", "tests*", "docs*"]

[tool.setuptools.package-data]
"dsl.language.grammar" = ["*.lark", "*.ebnf"]
"toetra.examples" = ["*.toetra"]

[tool.black]
line-length = 88
target-version = ["py311"]
force-exclude = '''
test/hypothesis/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    "test/hypothesis",
]

[tool.ruff.lint.per-file-ignores]
"test/unit/model/test_xgboost_introspector_optional.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
norecursedirs = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    ".hypothesis",
    "test/hypothesis",
]

[tool.pyright]
pythonVersion = "3.11"
include = [
    "toetra",
    "dsl",
    "model",
    "scripts",
    "test/unit",
]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    ".env",
    "**/*.env",
    ".venv",
    "**/*.venv",
    "build",
    "dist",
    "test/hypothesis",
]